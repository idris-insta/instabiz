name: CI + Deploy
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: |
          (command -v python3 && command -v node) && exit 0
          if command -v apk; then apk add --no-cache python3 nodejs git; \
          elif command -v apt-get; then apt-get update -qq && apt-get install -y python3 nodejs git; fi
          python3 --version; node --version

      - name: python compile
        run: |
          find instabiz -name '*.py' -not -path '*/node_modules/*' -print0 \
            | xargs -0 -n1 python3 -m py_compile
          echo "python OK"

      - name: js syntax
        run: |
          find instabiz -name '*.js' -not -path '*/node_modules/*' -not -path '*/dist/*' -print0 \
            | xargs -0 -n1 node --check
          echo "js OK"

      - name: json valid
        run: |
          find instabiz -name '*.json' -not -path '*/node_modules/*' -not -path '*/dist/*' -print0 \
            | xargs -0 -n1 python3 -c 'import json,sys; json.load(open(sys.argv[1]))'
          echo "json OK"

  deploy:
    needs: test
    if: gitea.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    concurrency: deploy-prod
    steps:
      - name: SSH deploy to prod
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.PROD_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 \
            "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" \
            "bash /home/frappe/frappe-bench/apps/instabiz/scripts/deploy_prod.sh ${{ gitea.sha }}"
